[package]
name = "gradavia-aggregator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "gradavia-ingest"
path = "src/main.rs"

[dependencies]
gradavia-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
serde.workspace = true
thiserror.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "json", "uuid"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
serde_json = { version = "1", features = ["arbitrary_precision"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
flate2 = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
httpdate = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
