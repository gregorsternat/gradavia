name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: ci-verify-${{ github.event_name == 'push' && github.sha || github.ref }}
      cancel-in-progress: true
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      TEST_DATABASE_URL: postgresql://gradavia:gradavia@127.0.0.1:5432/gradavia_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gradavia
          POSTGRES_PASSWORD: gradavia
          POSTGRES_DB: gradavia_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U gradavia -d gradavia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install locked dependencies
        run: just setup
      - name: Install browser system dependencies
        run: pnpm exec playwright install-deps chromium
      - name: Check, build and test
        run: just verify
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ github.run_attempt }}
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy production
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://gradavia.com
    concurrency:
      group: gradavia-production
      cancel-in-progress: false
      queue: max
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - name: Install locked dependencies
        run: just setup
      - name: Install browser system dependencies
        run: pnpm exec playwright install-deps chromium
      - name: Build and validate both releases before publishing
        run: just cf-check cf-api-image
      - name: Check this commit is still main
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A newer commit is on main; this release is skipped."
          fi
      - name: Publish the private API, then the prebuilt website
        if: steps.release.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set the production CLOUDFLARE_API_TOKEN secret before deploying."
            exit 1
          fi
          just cf-api-deploy
          just cf-web-publish
      - name: Verify public production data and routing
        if: steps.release.outputs.current == 'true'
        run: just cf-smoke
      - name: Preserve production smoke diagnostics
        if: always() && steps.release.outputs.current == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-smoke-${{ github.run_attempt }}
          path: .artifacts/cloudflare/smoke/
          if-no-files-found: ignore
          retention-days: 7
