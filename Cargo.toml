[workspace]
members = ["crates/core", "crates/aggregator", "crates/api"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
version = "0.1.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
